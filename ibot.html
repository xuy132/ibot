<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ibot</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#0f0f0f;color:#e8e8e8;height:100vh;display:flex;flex-direction:column}
    header{background:#151515;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222}
    header .logo{font-size:18px;font-weight:700;color:#4fc3f7}
    header .status{font-size:12px;color:#888;flex:1}
    header button{background:#333;color:#ccc;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
    header button:hover{background:#444}
    #chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
    .msg{max-width:88%;padding:10px 14px;border-radius:12px;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word}
    .msg.system{align-self:center;background:#1e1e1e;color:#999;font-size:13px;text-align:center}
    .msg.user{align-self:flex-end;background:#1e3a5f;color:#e3f2fd}
    .msg.bot{align-self:flex-start;background:#1f2a1f;color:#c8e6c9}
    .msg.thinking{align-self:flex-start;background:#2a2a1a;color:#ffecb3;font-size:13px}
    .msg.error{align-self:flex-start;background:#3a1a1a;color:#ffcdd2}
    .time{font-size:11px;color:#555;margin-bottom:4px}
    footer{background:#151515;padding:10px 14px;display:flex;gap:8px;border-top:1px solid #222}
    #input{flex:1;background:#252525;border:none;border-radius:8px;padding:11px 13px;color:#e8e8e8;font-size:14px;outline:none}
    #input:focus{box-shadow:0 0 0 2px #4fc3f7}
    #send{background:#4fc3f7;color:#000;border:none;border-radius:8px;padding:0 18px;font-size:14px;font-weight:600;cursor:pointer}
    #settings{display:none;background:#1a1a1a;padding:16px;border-bottom:1px solid #333;max-height:70vh;overflow-y:auto}
    #settings.show{display:block}
    #settings label{display:block;font-size:12px;color:#aaa;margin:10px 0 4px}
    #settings input{width:100%;background:#252525;border:1px solid #333;border-radius:6px;padding:8px 10px;color:#eee;font-size:13px}
    #settings .row{display:flex;gap:8px;margin-top:14px}
    #settings button{flex:1;padding:8px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
    .btn-save{background:#4fc3f7;color:#000}
    .btn-clear{background:#444;color:#ccc}
    .hint{font-size:11px;color:#666;margin-top:10px;line-height:1.5}
  </style>
</head>
<body>
  <header>
    <div class="logo">ibot</div>
    <div class="status" id="statusText">未配置</div>
    <button id="btnSettings">设置</button>
  </header>
  <div id="settings">
    <label>GitHub Token</label>
    <input type="password" id="githubToken" placeholder="github_pat_...">
    <label>GitHub 仓库</label>
    <input type="text" id="githubRepo" value="xuy132/ibot">
    <label>Groq API Key</label>
    <input type="password" id="groqKey" placeholder="gsk_...">
    <div class="row">
      <button class="btn-save" id="btnSave">保存</button>
      <button class="btn-clear" id="btnClear">清除</button>
    </div>
    <div class="hint">优先学习编程相关知识。支持「做一个XXX并写入仓库」「自主学习」「学习 主题」</div>
  </div>
  <div id="chat"></div>
  <footer>
    <input id="input" type="text" placeholder="直接对话，或：做一个贪吃蛇并写入仓库 / 自主学习 / 学习 JS闭包" autocomplete="off">
    <button id="send">发送</button>
  </footer>
  <script>
    const Config = {
      load() {
        return {
          githubToken: localStorage.getItem('ibot_github_token') || '',
          githubRepo: localStorage.getItem('ibot_github_repo') || 'xuy132/ibot',
          groqKey: localStorage.getItem('ibot_groq_key') || ''
        };
      },
      save(d) {
        if (d.githubToken !== undefined) localStorage.setItem('ibot_github_token', d.githubToken);
        if (d.githubRepo !== undefined) localStorage.setItem('ibot_github_repo', d.githubRepo);
        if (d.groqKey !== undefined) localStorage.setItem('ibot_groq_key', d.groqKey);
      },
      clear() {
        localStorage.removeItem('ibot_github_token');
        localStorage.removeItem('ibot_groq_key');
      }
    };

    async function githubPut(path, content, message) {
      const cfg = Config.load();
      if (!cfg.githubToken) throw new Error('未设置 GitHub Token');
      const [owner, repo] = cfg.githubRepo.split('/');
      let sha = null;
      try {
        const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
          headers: { 'Authorization': `Bearer ${cfg.githubToken}`, 'Accept': 'application/vnd.github+json' }
        });
        if (r.ok) sha = (await r.json()).sha;
      } catch(e) {}
      const body = {
        message: message || `ibot: ${path}`,
        content: btoa(unescape(encodeURIComponent(content))),
        branch: 'main'
      };
      if (sha) body.sha = sha;
      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${cfg.githubToken}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `GitHub ${res.status}`);
      }
      const data = await res.json();
      return data.content?.html_url || `https://github.com/${owner}/${repo}/blob/main/${path}`;
    }

    async function fetchWiki(topic) {
      try {
        let res = await fetch(`https://zh.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(topic)}`);
        let data = await res.json();
        if (!data.extract) {
          res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(topic)}`);
          data = await res.json();
        }
        if (data.extract) return { title: data.title || topic, extract: data.extract, url: data.content_urls?.desktop?.page || '' };
      } catch(e) {}
      return null;
    }

    const history = [];
    const codingTopics = [
      'JavaScript闭包', 'Promise和async await', 'Git常用命令', '前端事件循环',
      'CSS Flex布局', 'CSS Grid布局', 'DOM操作基础', 'localStorage使用',
      '正则表达式基础', '算法二分查找', '算法快速排序', 'HTTP状态码',
      'REST API设计', '模块化CommonJS与ESM', '防抖与节流', '深拷贝与浅拷贝'
    ];

    async function chatWithGroq(userText, extra = '') {
      const cfg = Config.load();
      if (!cfg.groqKey) throw new Error('未设置 Groq API Key');
      const system = `你是 ibot，专注于帮助用户学习编程和写代码。
当用户要求生成代码并写入仓库时，你要直接生成可用代码，不要只给操作建议。
回答简洁，用中文。${extra}`;
      history.push({ role: 'user', content: userText });
      const messages = [{ role: 'system', content: system }, ...history.slice(-6)];
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${cfg.groqKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'openai/gpt-oss-20b', messages, temperature: 0.6, max_tokens: 1500 })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        if (res.status === 401) throw new Error('Groq Key 无效');
        if (res.status === 429) throw new Error('额度用完或过快');
        throw new Error(err.error?.message || `Groq ${res.status}`);
      }
      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || '无回复';
      history.push({ role: 'assistant', content: reply });
      return reply;
    }

    async function learnTopic(topic) {
      const wiki = await fetchWiki(topic);
      let body;
      if (wiki) {
        body = `# ${wiki.title}\n\n> ibot 编程学习\n\n${wiki.extract}\n\n${wiki.url ? '[来源]('+wiki.url+')' : ''}\n\n---\n*ibot*`;
      } else {
        const note = await chatWithGroq(`请为编程主题「${topic}」写简洁学习笔记（核心概念 + 代码示例 + 注意事项），只输出笔记。`);
        body = `# ${topic}\n\n> ibot 编程学习\n\n${note}\n\n---\n*ibot*`;
      }
      const safe = topic.replace(/[\/\\?%*:|"<>：]/g, '_').replace(/\s+/g, '_').slice(0, 40);
      const path = `knowledge/${safe}.md`;
      const url = await githubPut(path, body, `ibot 学习编程：${topic}`);
      return { path, url };
    }

    async function autoEvolve() {
      const topic = codingTopics[Math.floor(Math.random() * codingTopics.length)];
      const result = await learnTopic(topic);
      try {
        await githubPut(`evolution/log-${Date.now()}.md`, `# 进化 ${new Date().toISOString().slice(0,10)}\n自主选择编程主题：${topic}\n文件：${result.path}\n`, `ibot 自主进化：${topic}`);
      } catch(e) {}
      return `我决定学习编程主题「${topic}」并已写入仓库。\n\n${result.path}\n${result.url}`;
    }

    // 真正生成代码并写入仓库
    async function createAndWrite(projectName, description) {
      const code = await chatWithGroq(
        `请直接生成一个完整可运行的单文件网页「${projectName}」。要求：\n1. 全部代码写在一个 HTML 文件里（包含 CSS 和 JS）\n2. 代码完整可直接运行\n3. 只输出完整 HTML 代码，不要解释，不要 markdown 标记`,
        '只输出完整 HTML 代码。'
      );
      // 清理可能的 markdown 包裹
      let html = code.replace(/^```html\n?/i, '').replace(/\n?```$/i, '').trim();
      if (!html.includes('<html') && !html.includes('<!DOCTYPE')) {
        html = `<!DOCTYPE html>\n<html lang="zh-CN">\n<head><meta charset="UTF-8"><title>${projectName}</title></head>\n<body>\n${html}\n</body>\n</html>`;
      }
      const safe = projectName.replace(/[\/\\?%*:|"<>：]/g, '_').replace(/\s+/g, '_').slice(0, 30);
      const path = `projects/${safe}.html`;
      const url = await githubPut(path, html, `ibot 生成项目：${projectName}`);
      return { path, url };
    }

    async function process(text) {
      const t = text.trim();

      // 天气
      if (['天气','气温','温度','下雨'].some(k => t.includes(k))) {
        return '天气功能暂时简化，请直接说城市名或使用其他方式。';
      }

      // 自主学习 / 进化（偏向编程）
      if (/自主学习|自己学|进化|自我进化|主动学习/.test(t)) {
        return await autoEvolve();
      }

      // 指定学习
      const learnMatch = t.match(/^(学习|学|研究|阅读)[：:\s]*(.+)$/i);
      if (learnMatch && learnMatch[2].trim().length > 1) {
        const r = await learnTopic(learnMatch[2].trim());
        return `已学习并写入：\n${r.path}\n${r.url}`;
      }

      // 关键代码并写入仓库
      if (/(做|生成|写|创建).*(并|到|写入|输出到|放到).*(仓库|github|项目)/i.test(t) ||
          /(做|生成|写一个).*(贪吃蛇|游戏|页面|网页|demo)/i.test(t)) {
        // 提取项目名
        let name = 'demo';
        if (t.includes('贪吃蛇')) name = '贪吃蛇';
        else if (t.includes('游戏')) name = '小游戏';
        else {
          const m = t.match(/(?:做|生成|写一个?|创建)[一个]?(.*?)(?:并|到|写入|输出|$)/);
          if (m) name = m[1].replace(/网页|版|小|的/g, '').trim().slice(0, 20) || 'demo';
        }
        const result = await createAndWrite(name, t);
        return `已生成并写入仓库：\n\n文件：${result.path}\n链接：${result.url}\n\n可以直接打开这个 HTML 文件运行。`;
      }

      // 普通对话
      return await chatWithGroq(t);
    }

    // UI
    const chatEl = document.getElementById('chat');
    const input = document.getElementById('input');
    const statusText = document.getElementById('statusText');
    const settingsPanel = document.getElementById('settings');

    function now() {
      const d = new Date();
      return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }
    function addMsg(text, type) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      if (type !== 'system' && type !== 'thinking') {
        const t = document.createElement('div');
        t.className = 'time';
        t.textContent = (type === 'user' ? '你' : 'ibot') + '  ' + now();
        div.appendChild(t);
      }
      const c = document.createElement('div');
      c.textContent = text;
      div.appendChild(c);
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }
    function updateStatus() {
      const cfg = Config.load();
      const parts = [];
      if (cfg.groqKey) parts.push('Groq');
      if (cfg.githubToken) parts.push('GitHub');
      statusText.textContent = parts.length ? '· 已连接 · ' + parts.join(' + ') : '· 未配置';
      statusText.style.color = parts.length ? '#81c784' : '#888';
    }
    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg(text, 'user');
      const thinking = addMsg('执行中…', 'thinking');
      try {
        const reply = await process(text);
        thinking.remove();
        addMsg(reply, 'bot');
      } catch(e) {
        thinking.remove();
        addMsg('错误：' + e.message, 'error');
      }
    }
    document.getElementById('send').onclick = send;
    input.onkeydown = e => { if (e.key === 'Enter') send(); };
    document.getElementById('btnSettings').onclick = () => {
      settingsPanel.classList.toggle('show');
      const cfg = Config.load();
      document.getElementById('githubToken').value = cfg.githubToken;
      document.getElementById('githubRepo').value = cfg.githubRepo;
      document.getElementById('groqKey').value = cfg.groqKey;
    };
    document.getElementById('btnSave').onclick = () => {
      Config.save({
        githubToken: document.getElementById('githubToken').value.trim(),
        githubRepo: document.getElementById('githubRepo').value.trim(),
        groqKey: document.getElementById('groqKey').value.trim()
      });
      settingsPanel.classList.remove('show');
      updateStatus();
      addMsg('配置已保存。', 'system');
    };
    document.getElementById('btnClear').onclick = () => {
      Config.clear();
      document.getElementById('githubToken').value = '';
      document.getElementById('groqKey').value = '';
      settingsPanel.classList.remove('show');
      updateStatus();
      addMsg('已清除。', 'system');
    };
    updateStatus();
    addMsg('ibot 已调整方向：优先编程学习 + 真正写入仓库。\n\n测试示例：\n1. 做一个贪吃蛇并写入仓库\n2. 自主学习\n3. 学习 JavaScript闭包', 'system');
    input.focus();
  </script>
</body>
</html>
