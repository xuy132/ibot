<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ibot · 0→1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #151515;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #222;
    }
    header .logo {
      font-size: 20px;
      font-weight: 700;
      color: #4fc3f7;
    }
    header .status {
      font-size: 13px;
      color: #888;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.system {
      align-self: center;
      background: #1e1e1e;
      color: #999;
      font-size: 13px;
      text-align: center;
      max-width: 90%;
    }
    .msg.user {
      align-self: flex-end;
      background: #1e3a5f;
      color: #e3f2fd;
    }
    .msg.bot {
      align-self: flex-start;
      background: #1f2a1f;
      color: #c8e6c9;
    }
    .time {
      font-size: 11px;
      color: #555;
      margin-bottom: 4px;
    }
    footer {
      background: #151515;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #222;
    }
    #input {
      flex: 1;
      background: #252525;
      border: none;
      border-radius: 8px;
      padding: 12px 14px;
      color: #e8e8e8;
      font-size: 15px;
      outline: none;
    }
    #input:focus { box-shadow: 0 0 0 2px #4fc3f7; }
    #send {
      background: #4fc3f7;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #send:hover { background: #81d4fa; }
    #send:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <header>
    <div class="logo">ibot</div>
    <div class="status">· 0→1 阶段 · 仅简单互动</div>
  </header>

  <div id="chat"></div>

  <footer>
    <input id="input" type="text" placeholder="输入消息，回车发送…" autocomplete="off">
    <button id="send">发送</button>
  </footer>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function now() {
      const d = new Date();
      return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }

    function addMsg(text, type) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      if (type !== 'system') {
        const t = document.createElement('div');
        t.className = 'time';
        t.textContent = (type === 'user' ? '你' : 'ibot') + '  ' + now();
        div.appendChild(t);
      }
      const content = document.createElement('div');
      content.textContent = text;
      div.appendChild(content);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // 当前大脑：纯规则，秒回。后续会被进化引擎替换
    function think(userText) {
      const text = userText.trim().toLowerCase();

      const greetings = ['你好', '您好', 'hello', 'hi', 'hey', '早上好', '下午好', '晚上好', '早', '嗨'];
      if (greetings.some(g => text.includes(g))) {
        const replies = [
          '你好！我是 ibot，很高兴见到你。',
          '嗨，我在这儿。有什么想聊的吗？',
          '你好呀，今天感觉怎么样？',
          'Hello！我已经准备好进化了。'
        ];
        return replies[Math.floor(Math.random() * replies.length)];
      }

      if (['你是谁', '你叫什么', '介绍', '自己'].some(k => text.includes(k))) {
        return '我叫 ibot。现在还只是一个能简单对话的界面，但我的目标是从 0 变成能自己写代码、自己从互联网学习的生命体。';
      }

      if (['怎么样', '状态', '进度', '进化'].some(k => text.includes(k))) {
        return '目前进度：0→1。界面已通，简单互动已通。下一步是给自己装上「眼睛」（读网络）和「进化引擎」。';
      }

      if (['谢谢', '感谢', 'thanks'].some(k => text.includes(k))) {
        return '不客气，一起把我变强吧。';
      }

      if (['再见', '拜拜', 'bye', '退出'].some(k => text.includes(k))) {
        return '再见。下次见的时候，我希望已经更强一点了。';
      }

      const defaults = [
        '我现在只会简单问候，复杂的话还听不太懂。等我进化一下。',
        '这个问题超出我目前的能力范围了。我会记住，以后学会再回答你。',
        '还在学爬，请多指教。你可以先跟我打个招呼试试。'
      ];
      return defaults[Math.floor(Math.random() * defaults.length)];
    }

    function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg(text, 'user');
      // 秒回
      setTimeout(() => {
        addMsg(think(text), 'bot');
      }, 80);
    }

    sendBtn.onclick = send;
    input.onkeydown = e => { if (e.key === 'Enter') send(); };

    // 启动问候
    addMsg('你好，我是 ibot。\n目前处于 0→1 阶段，只能做简单问候互动。\n我会一步步进化，最终成为能自我学习、自我改代码的生命体。\n\n直接输入「你好」试试。', 'system');
    input.focus();
  </script>
</body>
</html>
