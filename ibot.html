<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ibot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #0f0f0f; color: #e8e8e8; height: 100vh;
      display: flex; flex-direction: column;
    }
    header {
      background: #151515; padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid #222;
    }
    header .logo { font-size: 18px; font-weight: 700; color: #4fc3f7; }
    header .status { font-size: 12px; color: #888; flex: 1; }
    header button {
      background: #333; color: #ccc; border: none; border-radius: 6px;
      padding: 6px 12px; font-size: 12px; cursor: pointer;
    }
    header button:hover { background: #444; }
    #chat {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      max-width: 88%; padding: 10px 14px; border-radius: 12px;
      line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-break: break-word;
    }
    .msg.system { align-self: center; background: #1e1e1e; color: #999; font-size: 13px; text-align: center; }
    .msg.user { align-self: flex-end; background: #1e3a5f; color: #e3f2fd; }
    .msg.bot { align-self: flex-start; background: #1f2a1f; color: #c8e6c9; }
    .msg.thinking { align-self: flex-start; background: #2a2a1a; color: #ffecb3; font-size: 13px; }
    .msg.error { align-self: flex-start; background: #3a1a1a; color: #ffcdd2; }
    .time { font-size: 11px; color: #555; margin-bottom: 4px; }
    footer {
      background: #151515; padding: 10px 14px; display: flex; gap: 8px;
      border-top: 1px solid #222;
    }
    #input {
      flex: 1; background: #252525; border: none; border-radius: 8px;
      padding: 11px 13px; color: #e8e8e8; font-size: 14px; outline: none;
    }
    #input:focus { box-shadow: 0 0 0 2px #4fc3f7; }
    #send {
      background: #4fc3f7; color: #000; border: none; border-radius: 8px;
      padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    #settings {
      display: none; background: #1a1a1a; padding: 16px; border-bottom: 1px solid #333;
      max-height: 70vh; overflow-y: auto;
    }
    #settings.show { display: block; }
    #settings label { display: block; font-size: 12px; color: #aaa; margin: 10px 0 4px; }
    #settings input {
      width: 100%; background: #252525; border: 1px solid #333; border-radius: 6px;
      padding: 8px 10px; color: #eee; font-size: 13px;
    }
    #settings .row { display: flex; gap: 8px; margin-top: 14px; }
    #settings button { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-save { background: #4fc3f7; color: #000; }
    .btn-clear { background: #444; color: #ccc; }
    .hint { font-size: 11px; color: #666; margin-top: 10px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <div class="logo">ibot</div>
    <div class="status" id="statusText">未配置</div>
    <button id="btnSettings">设置</button>
  </header>

  <div id="settings">
    <label>GitHub Token（写入知识库用）</label>
    <input type="password" id="githubToken" placeholder="github_pat_...">
    <label>GitHub 仓库</label>
    <input type="text" id="githubRepo" value="xuy132/ibot">
    <label>Groq API Key（对话大脑）</label>
    <input type="password" id="groqKey" placeholder="gsk_...">
    <div class="row">
      <button class="btn-save" id="btnSave">保存到本机</button>
      <button class="btn-clear" id="btnClear">清除所有 Key</button>
    </div>
    <div class="hint">
      所有 Key 只保存在你浏览器本地。<br>
      当前使用模型：openai/gpt-oss-20b（免费可用）<br>
      永远不要把任何 Key 发到聊天窗口。
    </div>
  </div>

  <div id="chat"></div>

  <footer>
    <input id="input" type="text" placeholder="直接对话，或输入：天气 上饶 / 学习 主题" autocomplete="off">
    <button id="send">发送</button>
  </footer>

  <script>
    const Config = {
      load() {
        return {
          githubToken: localStorage.getItem('ibot_github_token') || '',
          githubRepo: localStorage.getItem('ibot_github_repo') || 'xuy132/ibot',
          groqKey: localStorage.getItem('ibot_groq_key') || ''
        };
      },
      save(data) {
        if (data.githubToken !== undefined) localStorage.setItem('ibot_github_token', data.githubToken);
        if (data.githubRepo !== undefined) localStorage.setItem('ibot_github_repo', data.githubRepo);
        if (data.groqKey !== undefined) localStorage.setItem('ibot_groq_key', data.groqKey);
      },
      clear() {
        localStorage.removeItem('ibot_github_token');
        localStorage.removeItem('ibot_groq_key');
      }
    };

    async function githubPut(path, content, message) {
      const cfg = Config.load();
      if (!cfg.githubToken) throw new Error('未设置 GitHub Token');
      const [owner, repo] = cfg.githubRepo.split('/');
      if (!owner || !repo) throw new Error('仓库格式错误');

      let sha = null;
      try {
        const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
          headers: { 'Authorization': `Bearer ${cfg.githubToken}`, 'Accept': 'application/vnd.github+json' }
        });
        if (r.ok) sha = (await r.json()).sha;
      } catch(e) {}

      const body = {
        message: message || `ibot: ${path}`,
        content: btoa(unescape(encodeURIComponent(content))),
        branch: 'main'
      };
      if (sha) body.sha = sha;

      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${cfg.githubToken}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `GitHub ${res.status}`);
      }
      const data = await res.json();
      return data.content?.html_url || '';
    }

    async function getWeather(place) {
      try {
        const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=zh&format=json`).then(r => r.json());
        if (!geo.results?.length) return `找不到地点「${place}」`;
        const loc = geo.results[0];
        const name = loc.name + (loc.admin1 ? ' · ' + loc.admin1 : '');
        const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Asia/Shanghai`).then(r => r.json());
        const c = w.current;
        const map = {0:'晴朗',1:'主要晴朗',2:'局部多云',3:'阴天',45:'有雾',61:'小雨',63:'中雨',65:'大雨',71:'小雪',80:'小阵雨',95:'雷暴'};
        return `${name}\n气温 ${c.temperature_2m}°C\n湿度 ${c.relative_humidity_2m}%\n风速 ${c.wind_speed_10m} km/h\n状况：${map[c.weather_code] || '未知'}`;
      } catch(e) {
        return '天气查询失败：' + e.message;
      }
    }

    const history = [];

    async function chatWithGroq(userText) {
      const cfg = Config.load();
      if (!cfg.groqKey) throw new Error('未设置 Groq API Key，请先点右上角「设置」');

      const systemPrompt = `你是 ibot，一个运行在纯网页上的个人智能体。
你的目标是帮助用户学习、回答问题，并尽量给出有用、诚实的回答。
回答请使用中文，简洁有条理。`;

      history.push({ role: 'user', content: userText });

      const messages = [
        { role: 'system', content: systemPrompt },
        ...history.slice(-8)
      ];

      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${cfg.groqKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: 'openai/gpt-oss-20b',   // 已改为当前免费可用的模型
          messages: messages,
          temperature: 0.7,
          max_tokens: 1024
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        if (res.status === 401) throw new Error('Groq Key 无效，请检查设置');
        if (res.status === 429) throw new Error('Groq 额度已用完或请求过快，请稍后再试');
        throw new Error(err.error?.message || `Groq 错误 ${res.status}`);
      }

      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || '没有收到有效回复';
      history.push({ role: 'assistant', content: reply });
      return reply;
    }

    async function process(text) {
      const original = text.trim();

      // 天气
      if (['天气', '气温', '温度', '下雨'].some(k => original.includes(k))) {
        let place = original
          .replace(/今天|今日|明天|现在|的|天气|气温|温度|怎么样|如何|多少度|冷不冷|热不热|穿衣注意|穿衣|[？?。,，、]/g, ' ')
          .trim()
          .split(/\s+/)[0];
        if (!place || place.length < 2) place = '上饶';
        return await getWeather(place);
      }

      // 学习
      const learnMatch = original.match(/^(学习|学|研究|阅读)[：:\s]*(.+)$/i);
      if (learnMatch) {
        const topic = learnMatch[2].trim();
        const content = await chatWithGroq(`请为「${topic}」写一份简洁有用的学习笔记，包含核心要点和建议的下一步。用中文。`);
        const date = new Date().toISOString().slice(0, 10);
        const safeName = topic.replace(/[\/\\?%*:|"<>：]/g, '_').replace(/\s+/g, '_').slice(0, 40);
        const path = `knowledge/${safeName}.md`;
        try {
          await githubPut(path, `# ${topic}\n\n> ibot 于 ${date} 学习\n\n${content}\n\n---\n*ibot*`, `ibot 学习：${topic}`);
          return `已学习并写入知识库。\n文件：${path}\n\n${content}`;
        } catch (e) {
          return `学习内容已生成，但写入 GitHub 失败：${e.message}\n\n${content}`;
        }
      }

      // 默认对话
      return await chatWithGroq(original);
    }

    // UI
    const chatEl = document.getElementById('chat');
    const input = document.getElementById('input');
    const statusText = document.getElementById('statusText');
    const settingsPanel = document.getElementById('settings');

    function now() {
      const d = new Date();
      return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }

    function addMsg(text, type) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      if (type !== 'system' && type !== 'thinking') {
        const t = document.createElement('div');
        t.className = 'time';
        t.textContent = (type === 'user' ? '你' : 'ibot') + '  ' + now();
        div.appendChild(t);
      }
      const c = document.createElement('div');
      c.textContent = text;
      div.appendChild(c);
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function updateStatus() {
      const cfg = Config.load();
      const parts = [];
      if (cfg.groqKey) parts.push('Groq');
      if (cfg.githubToken) parts.push('GitHub');
      if (parts.length) {
        statusText.textContent = '· 已连接 · ' + parts.join(' + ');
        statusText.style.color = '#81c784';
      } else {
        statusText.textContent = '· 未配置 Key';
        statusText.style.color = '#888';
      }
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg(text, 'user');
      const thinking = addMsg('思考中…', 'thinking');
      try {
        const reply = await process(text);
        thinking.remove();
        addMsg(reply, 'bot');
      } catch (e) {
        thinking.remove();
        addMsg('错误：' + e.message, 'error');
      }
    }

    document.getElementById('send').onclick = send;
    input.onkeydown = e => { if (e.key === 'Enter') send(); };

    document.getElementById('btnSettings').onclick = () => {
      settingsPanel.classList.toggle('show');
      const cfg = Config.load();
      document.getElementById('githubToken').value = cfg.githubToken;
      document.getElementById('githubRepo').value = cfg.githubRepo;
      document.getElementById('groqKey').value = cfg.groqKey;
    };

    document.getElementById('btnSave').onclick = () => {
      Config.save({
        githubToken: document.getElementById('githubToken').value.trim(),
        githubRepo: document.getElementById('githubRepo').value.trim(),
        groqKey: document.getElementById('groqKey').value.trim()
      });
      settingsPanel.classList.remove('show');
      updateStatus();
      addMsg('配置已保存到本机。', 'system');
    };

    document.getElementById('btnClear').onclick = () => {
      Config.clear();
      document.getElementById('githubToken').value = '';
      document.getElementById('groqKey').value = '';
      settingsPanel.classList.remove('show');
      updateStatus();
      addMsg('所有 Key 已清除。', 'system');
    };

    updateStatus();
    addMsg('ibot 已启动（已修复模型）。\n\n当前使用免费模型：openai/gpt-oss-20b\n\n请确认设置里已填入正确的 Groq Key，然后直接对话测试。', 'system');
    input.focus();
  </script>
</body>
</html>
